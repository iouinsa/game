<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herbal Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            /* Kunci body agar tidak bisa di-scroll dan pas di layar HP */
            height: 100dvh;
            width: 100vw;
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }

        /* Background full screen, fixed agar gambar tidak melar */
        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Menggunakan contain agar seluruh gambar terlihat tanpa terpotong, 
               atau cover jika ingin penuh memenuhi layar */
            background-image: url('https://i.ibb.co.com/rR40VYx6/UCI-2026-Instagram-Reel.png');
            background-size: cover; /* Ubah ke 'contain' jika gambar tidak mau terpotong sama sekali */
            background-position: center top;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Overlay Hitam Gradasi (Tipis di tengah, agak gelap di bawah) */
        .hero-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.7) 100%);
            z-index: -1;
        }

        /* Animasi tombol muncul */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.5s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="flex flex-col justify-end items-center pb-10 px-6">

    <!-- Layer Background & Overlay -->
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <!-- Konten (Tombol) -->
    <div class="w-full max-w-sm space-y-3 z-10">
        
        <!-- Tombol Peserta -->
        <button onclick="alert('Masuk ke Halaman Peserta')" class="w-full bg-green-600 hover:bg-green-700 text-white rounded-2xl p-4 font-bold text-lg shadow-lg shadow-black/50 transition-all active:scale-95 flex items-center justify-center gap-2 fade-in-up delay-1">
            <span class="text-2xl">🔍</span> Mulai Berburu
        </button>
        
        <!-- Tombol Juri -->
        <button onclick="alert('Masuk ke Halaman Juri')" class="w-full bg-gray-900/90 backdrop-blur-sm hover:bg-gray-900 text-white rounded-2xl p-4 font-bold text-lg shadow-lg shadow-black/50 transition-all active:scale-95 flex items-center justify-center gap-2 fade-in-up delay-2">
            <span class="text-2xl">⚖️</span> Panel Juri
        </button>

    </div>

</body>
</html>
